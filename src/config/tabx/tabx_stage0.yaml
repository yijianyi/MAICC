# Server-ready TABX stage-0 configuration.
#
# Raw dataset:
# /mnt/cfs/shaopt/data/MARL/offline_sequence_samples/
#   overfit16_1280rec_3000_clean_8gpu4proc_20260728_174515

data:
  manifest: /mnt/cfs/shaopt/data/MARL/maicc_tabx/overfit16_l64/manifest.json
  normalization: /mnt/cfs/shaopt/data/MARL/maicc_tabx/overfit16_l64/obs_normalization.npz
  h5_lru_size: 16
  normalization_clip: 10.0
  preserve_zero_padding: true

model:
  # tabx_transformer replaces only the centralized CEM with factorized
  # spatial/temporal attention. DEM and DT retain the original MAICC code.
  agent: tabx_transformer
  max_agents: 20
  n_embd: 64
  n_layer: 4
  n_head: 4
  hidden_dim: 128
  dropout: 0.1
  use_rtg: false
  # Keep false for the first data-pipeline overfit. Switch to true after that
  # to train the factorized centralized teacher and DEM distillation losses.
  train_cem: false

training:
  device: auto
  seed: 7
  total_steps: 100000
  max_batch_size: 8
  agent_time_budget: 8192
  learning_rate: 0.0005
  grad_norm_clip: 10.0
  use_amp: false
  max_return: auto
  min_return: auto
  log_interval: 100
  progress_interval: 100
  save_interval: 10000
  output_dir: /mnt/cfs/shaopt/data/MARL/maicc_results/overfit16_stage0

retrieval:
  k: 2
  search_k: 32
  max_similarity: 0.98
