# Data-only adapter configuration for the original MAICC implementation.
# The launcher overwrites manifest-derived values before Sacred starts.
env: "tabx"

env_args:
  key: "tabx_original_maicc"
  manifest: "datasets/tabx_original_maicc/train_manifest.json"
  time_limit: 64
  embedding_cache: ""

# Audit/execution fields supplied by tools/run_original_maicc_tabx.py.
# Sacred rejects command-line additions unless the selected configuration
# declares them first.
baseline_micro_batch_size: 0
baseline_gradient_checkpointing: False
baseline_upstream_commit: "e1640a9"
baseline_manifest_sha256: ""
baseline_execution: "byte_exact_learner"
baseline_padding_mode: "strict"
baseline_data_parallel: False
baseline_parallel_devices: 1

test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000

k: 2
l: 50
max_return: 1
min_return: 0
task_nums: 1
trajs_per_task: 20
batch_size: 32
max_similarity: 0.98
